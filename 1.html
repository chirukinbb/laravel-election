<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Tree - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            z-index: 1000;
        }
    </style>
</head>
<body>
<div id="loading">Loading 3D Model...</div>
<div id="canvas-container"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }

</script>

<script type="module">
    import * as THREE from 'three';
    import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
    import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
    import {DragControls} from 'three/addons/controls/DragControls.js';

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sky blue background

    // Camera setup
    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(0, 2, 5);

    // Renderer setup
    const renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 20;
    controls.minDistance = 1;

    // Drag controls - will be initialized after model loads
    let dragControls = null;
    let draggableObjects = [];

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(10, 10, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 2048;
    directionalLight.shadow.mapSize.height = 2048;
    scene.add(directionalLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
    backLight.position.set(-10, 5, -5);
    scene.add(backLight);

    // Load GLB model
    const loader = new GLTFLoader();

    // Optional: Setup Draco decoder for compressed models
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
    loader.setDRACOLoader(dracoLoader);

    loader.load(
        'Unity_Tree_v2.glb',
        function (gltf) {
            const model = gltf.scene;

            // Enable shadows for all meshes
            model.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            scene.add(model);

            // Collect all meshes for dragging
            model.traverse(function (child) {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    draggableObjects.push(child);
                }
            });

            // Initialize drag controls
            dragControls = new DragControls(draggableObjects, camera, renderer.domElement);

            dragControls.addEventListener('dragstart', function (event) {
                controls.enabled = false; // Disable orbit controls while dragging
                event.object.material?.emissive?.set(0xaaaaaa);
            });

            dragControls.addEventListener('drag', function (event) {
                // Object is being dragged
            });

            dragControls.addEventListener('dragend', function (event) {
                controls.enabled = true; // Re-enable orbit controls after dragging
                event.object.material?.emissive?.set(0x000000);
            });

            // Center and scale the model
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            // Reset position to center
            model.position.x = -center.x;
            model.position.y = -center.y;
            model.position.z = -center.z;

            // Scale to fit view
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim > 0) {
                const scale = 3 / maxDim;
                model.scale.multiplyScalar(scale);
            }

            // Hide loading text
            document.getElementById('loading').style.display = 'none';

            console.log('Model loaded successfully', gltf);
        },
        function (xhr) {
            // Progress callback
            if (xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                document.getElementById('loading').textContent = `Loading: ${percent}%`;
            }
        },
        function (error) {
            console.error('Error loading model:', error);
            document.getElementById('loading').textContent = 'Error loading model. Check console for details.';
        }
    );

    // Handle window resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Keyboard shortcut to toggle drag mode
    let dragMode = false;
    window.addEventListener('keydown', (e) => {
        if (e.key === 'd' || e.key === 'D') {
            dragMode = !dragMode;
            if (dragControls) {
                dragControls.enabled = dragMode;
            }
            console.log('Drag mode:', dragMode ? 'ON (press D to toggle)' : 'OFF');
        }
    });

    console.log('Controls:');
    console.log('- Left mouse + drag: Rotate camera');
    console.log('- Right mouse + drag: Pan camera');
    console.log('- Mouse wheel: Zoom');
    console.log('- Press D: Toggle object drag mode');
    console.log('- In drag mode: Click and drag object to move it');

    // Animation loop
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
